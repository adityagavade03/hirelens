# Independent free cloud configuration. This file does not prove a live deployment.
# Read docs/RENDER-DEPLOYMENT.md before applying; data and secrets are not copied.
services:
  - type: web
    name: hirelens-adityagavade03
    runtime: node
    plan: free
    region: singapore
    rootDir: .
    buildCommand: >-
      MONGOMS_DISABLE_POSTINSTALL=1 npm ci --include=dev &&
      npm run setup:assets && npm run build &&
      node scripts/check-cloud-connectivity.mjs --synthetic && npm prune --omit=dev
    startCommand: npm start
    autoDeployTrigger: "off"
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "24"
      - key: NODE_ENV
        value: production
      - key: HOST
        value: 0.0.0.0
      - key: PORT
        value: "4000"
      - key: APP_ORIGIN
        fromService:
          type: web
          name: hirelens-adityagavade03
          envVarKey: RENDER_EXTERNAL_URL
      - key: MONGODB_URI
        sync: false
      - key: OTP_HASH_SECRET
        generateValue: true
      - key: EMAIL_FROM
        sync: false
      # Direct HTTPS delivery; do not copy the laptop's Gmail SMTP settings.
      - key: EMAIL_PROVIDER
        value: brevo
      - key: BREVO_API_KEY
        sync: false
      - key: STORAGE_BUDGET_MB
        value: "400"
      - key: STORAGE_BUDGET_SCOPE
        value: atlas-cluster
      # Leave REDIS_URL unset for this single-instance deployment.
      - key: MESSAGE_PREVIEW
        value: "false"
      - key: ALLOW_DEMO_LOGIN
        value: "false"
      - key: ALLOW_LOCAL_COMPANY_REGISTRATION
        value: "false"
      - key: EMAIL_VERIFICATION_REQUIRED
        value: "true"
      - key: COMPANY_LOGIN_OTP_REQUIRED
        value: "true"
      - key: TURN_LOCAL_DEV
        value: "false"
      - key: FACE_MODEL_URL
        value: /vendor/mediapipe/blaze_face_short_range.tflite
      - key: MEDIAPIPE_WASM_URL
        value: /vendor/mediapipe/wasm
      - key: FACE_LANDMARK_MODEL_URL
        value: /vendor/mediapipe/face_landmarker.task
      - key: OBJECT_MODEL_URL
        value: /vendor/mediapipe/efficientdet_lite0.tflite
      - key: OBJECT_ACCURACY_MODEL_URL
        value: /vendor/mediapipe/efficientdet_lite2.tflite
      - key: RESUME_OCR_ENABLED
        value: "true"
      # Set hosted LLM_BASE_URL/LLM_API_KEY/LLM_MODEL and
      # STT_BASE_URL/STT_API_KEY/STT_MODEL privately after provider setup.
      # Optional CLOUD_TEST_COMPANY_IDS and CLOUD_TEST_EXPIRES_AT must contain
      # only the owner-approved company scope and its original absolute expiry.
      # Never add PRIVATE_PREVIEW_ settings or laptop service URLs here.
