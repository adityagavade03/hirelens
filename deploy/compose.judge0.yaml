# Based on Judge0 CE v1.13.1. Use a dedicated compatible Linux execution host.
# Run with --project-directory pointing at the HireLens project root.
name: hirelens-judge0
services:
  server:
    image: judge0/judge0:1.13.1
    privileged: true
    restart: unless-stopped
    volumes:
      - ./.data/judge0/judge0.conf:/judge0.conf:ro
    ports:
      - "127.0.0.1:2358:2358"
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
  workers:
    image: judge0/judge0:1.13.1
    command: ["./scripts/workers"]
    privileged: true
    restart: unless-stopped
    volumes:
      - ./.data/judge0/judge0.conf:/judge0.conf:ro
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_started }
    logging:
      driver: json-file
      options: { max-size: 10m, max-file: "2" }
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    env_file: ./.data/judge0/judge0.conf
    volumes:
      - judge-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U judge0 -d judge0"]
      interval: 5s
      timeout: 3s
      retries: 20
  redis:
    image: redis:7-alpine
    restart: unless-stopped
    env_file: ./.data/judge0/judge0.conf
    command: [sh, -c, 'exec redis-server --appendonly no --requirepass "$$REDIS_PASSWORD"']
volumes:
  judge-data:
